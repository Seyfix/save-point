<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380">
  <defs>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#5a3fd9"/>
    </linearGradient>
  </defs>

  <!-- свечение -->
  <ellipse cx="220" cy="330" rx="150" ry="18" fill="#000" opacity=".35"/>

  <!-- геймпад -->
  <g transform="rotate(-10 220 200)">
    <path d="M110 130h220c46 0 76 50 76 116 0 44-20 70-46 70-34 0-48-48-80-48H160c-32 0-46 48-80 48-26 0-46-26-46-70 0-66 30-116 76-116z" fill="url(#pad)" stroke="#0e0f1f" stroke-width="6"/>
    <!-- крестовина -->
    <rect x="92" y="190" width="70" height="22" rx="5" fill="#0e0f1f"/>
    <rect x="116" y="166" width="22" height="70" rx="5" fill="#0e0f1f"/>
    <!-- кнопки -->
    <circle cx="300" cy="176" r="14" fill="#22d3ee" stroke="#0e0f1f" stroke-width="4"/>
    <circle cx="330" cy="206" r="14" fill="#ff4d8d" stroke="#0e0f1f" stroke-width="4"/>
    <circle cx="270" cy="206" r="14" fill="#3ddc97" stroke="#0e0f1f" stroke-width="4"/>
    <circle cx="300" cy="236" r="14" fill="#ffc857" stroke="#0e0f1f" stroke-width="4"/>
    <!-- стики -->
    <circle cx="170" cy="262" r="20" fill="#0e0f1f"/>
    <circle cx="250" cy="262" r="20" fill="#0e0f1f"/>
    <rect x="196" y="172" width="16" height="8" rx="3" fill="#0e0f1f"/>
    <rect x="224" y="172" width="16" height="8" rx="3" fill="#0e0f1f"/>
  </g>

  <!-- пиксельное сердце -->
  <g transform="translate(330 30)" fill="#ff4d8d">
    <rect x="8" y="0" width="16" height="8"/><rect x="40" y="0" width="16" height="8"/>
    <rect x="0" y="8" width="64" height="16"/>
    <rect x="8" y="24" width="48" height="8"/>
    <rect x="16" y="32" width="32" height="8"/>
    <rect x="24" y="40" width="16" height="8"/>
    <rect x="16" y="8" width="8" height="8" fill="#fff" opacity=".7"/>
  </g>

  <!-- пиксельная монета -->
  <g transform="translate(40 40)">
    <rect x="8" y="0" width="32" height="48" fill="#ffc857"/>
    <rect x="0" y="8" width="48" height="32" fill="#ffc857"/>
    <rect x="20" y="10" width="8" height="28" fill="#e09a1f"/>
    <rect x="8" y="8" width="6" height="6" fill="#fff" opacity=".7"/>
  </g>

  <!-- «+1 UP» -->
  <text x="60" y="130" font-family="Arial Black, Arial, sans-serif" font-size="22" fill="#22d3ee">+1 UP</text>
</svg>
